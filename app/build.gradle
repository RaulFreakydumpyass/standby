plugins {
    id 'com.android.application'
}

android {
    namespace 'com.standby.clock'
    compileSdk 34

    defaultConfig {
        applicationId "com.standby.clock"
        minSdk 24
        targetSdk 28          // Android 9 behaviour, matches the tablet
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
